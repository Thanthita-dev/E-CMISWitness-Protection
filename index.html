  <style>
    @font-face{font-family:"Kanit";font-style:normal;font-weight:300;font-display:swap;src:url("./assets/fonts/Kanit-Light.ttf") format("truetype")}
    @font-face{font-family:"Kanit";font-style:normal;font-weight:400;font-display:swap;src:url("./assets/fonts/Kanit-Regular.ttf") format("truetype")}

    @media(max-width:820px){.app{grid-template-columns:84px minmax(0,1fr)}.brand>div:last-child,.nav button span,.nav-group,.profile>div:last-child{display:none}.nav button,.nav button.sub{justify-content:center;padding:10px}.top{padding:0 14px}.global-search{display:none}.content{padding:18px 14px 45px}.form-page,.public-page{margin:-18px -14px -45px}.form-header{padding:18px 14px}.workspace{padding:14px 12px 95px}.sticky-actions{left:84px}.catalog{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}.case-context{grid-template-columns:1fr 1fr}.role-select{min-width:145px;max-width:180px}.top-right .icon-btn:nth-of-type(n+2){display:none}}
    @media(max-width:560px){.app{display:block}.side{display:none}.mobile-only{display:inline-flex}.top{height:64px}.top .collapse{display:none}.role-select{width:150px}.top-right .uat{display:none}.page-head,.card-head,.public-head,.signature-head,.signature-action{flex-direction:column}.toolbar,.form-grid,.signature-fields{grid-template-columns:1fr}.field.wide,.signature-step{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.stat{min-height:102px;padding:12px}.case-context{grid-template-columns:1fr}.catalog{grid-template-columns:1fr}.form-tile{grid-template-columns:48px 1fr}.form-tile .btn{grid-column:1/-1}.sticky-actions{left:0;padding:10px 12px}.public-steps{grid-template-columns:1fr 1fr}.repeat-table{grid-template-columns:34px 1fr auto}.repeat-table>*:nth-child(3n){display:none}}
  </style>
  <style id="kb1-preview-upgrade">
    /* Preview A4 ขนาดอ่านได้จริงบน Desktop */
    .workspace{grid-template-columns:minmax(0,1.12fr) minmax(520px,.88fr);gap:20px}
    .paper-wrap{padding:16px;background:#dfe6ee}
    .paper-caption{position:sticky;top:0;z-index:2;align-items:center;padding:12px 14px;box-shadow:0 2px 8px rgba(16,40,75,.08)}
    .paper-caption small{display:block;margin-top:2px;color:var(--muted);font-weight:400}
    .paper{width:100%;min-height:0;aspect-ratio:210/297;padding:7.5% 7%;font-size:16px;line-height:1.55}
    .paper h3{font-size:22px;line-height:1.35}.paper-line{font-size:15px;padding:9px 0}.paper p{font-size:15px}
    .paper.kb1-paper{position:relative;color:#1a2433;background:#fdfdfc;padding:7% 7.5% 6.5%}
    .paper.kb1-paper .secret-mark{text-align:center;color:#d7352d;font-size:24px;font-weight:900}
    .paper.kb1-paper .doc-top{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;margin:14px 0 18px}
    .paper.kb1-paper .doc-emblem{text-align:center;font-size:56px;line-height:1;color:#274d8d}
    .paper.kb1-paper .doc-meta{text-align:right;font-size:14px;line-height:1.8}
    .paper.kb1-paper .doc-title{text-align:center;margin:12px 0 20px;font-size:20px;font-weight:900}
    .paper.kb1-paper .doc-row{margin:6px 0;font-size:14px;line-height:1.65}
    .paper.kb1-paper .doc-row strong{font-weight:900}.paper.kb1-paper .fill{border-bottom:1px dotted #4f5967;color:#173e70;font-weight:800;padding:0 7px}
    .paper.kb1-paper .box{display:inline-block;width:14px;height:14px;margin:0 4px;border:1px solid #334155;vertical-align:-2px}
    .paper.kb1-paper .box.checked::after{content:"✓";display:block;margin-top:-5px;color:#15558f;font-size:17px;font-weight:900}
    .paper.kb1-paper .doc-lines{height:18px;margin:6px 0;border-bottom:1px dotted #667080}
    .paper.kb1-paper .doc-signatures{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:48px;text-align:center;font-size:14px}
    .paper.kb1-paper .doc-footer{position:absolute;right:7%;bottom:3.5%;font-size:13px}.paper.kb1-paper .secret-bottom{position:absolute;left:0;right:0;bottom:1%;text-align:center;color:#d7352d;font-size:22px;font-weight:900}
    .paper.kb1-paper .doc-emblem img{display:block;width:72px;height:72px;margin:auto;object-fit:contain}
    .paper.kb1-paper .doc-section{margin:13px 0 7px;padding-bottom:4px;border-bottom:1px solid #647184;font-size:15px;font-weight:900}
    .paper.kb1-paper .doc-subrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .paper.kb1-paper .id-boxes{display:inline-flex;flex-wrap:nowrap;gap:2px;vertical-align:middle}
    .paper.kb1-paper .id-box{display:inline-grid;place-items:center;width:16px;height:19px;border:1px solid #4b5563;color:#173e70;font-size:10px;font-weight:800}
    .paper.kb1-paper .signature-status{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 7px;border-radius:999px;background:#edf3f9;color:#355679;font-size:10px;font-weight:700}
    .paper.kb1-paper .signature-status.complete{background:#e7f5ec;color:#24714a}
    .paper.kb1-paper .doc-note{margin:10px 0;padding:8px 10px;border-left:3px solid #c6a13d;background:#fff9ea;font-size:11px;line-height:1.55}
    .public-official-preview .paper.kb1-paper{min-height:720px;aspect-ratio:210/297;box-shadow:0 5px 18px rgba(16,40,75,.12)}
    .public-official-preview .official-page-switcher{margin-top:10px}
    .choice-group{grid-column:1/-1}.choice-group>label{display:block;margin-bottom:7px;color:#34465f;font-size:12px;font-weight:800}
    .choice-options{display:flex;flex-wrap:wrap;gap:8px 18px;padding:11px 12px;border:1px solid #cbd6e2;border-radius:8px;background:#f8fafc}
    .choice{display:flex;align-items:flex-start;gap:7px;line-height:1.45}.choice input{width:auto;min-height:auto;margin-top:3px}
    .terms-list{display:grid;gap:9px}.terms-list .choice{padding:9px 10px;border-radius:7px;background:#f2f6fa}
    .address-heading{grid-column:1/-1;margin-top:4px;padding-bottom:5px;border-bottom:1px solid #e2e8ef;color:#174f83;font-weight:900}
    .advanced-filter{margin:-5px 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
    .advanced-filter summary{cursor:pointer;padding:13px 18px;color:#16558f;font-weight:900;list-style:none}.advanced-filter summary::-webkit-details-marker{display:none}.advanced-filter summary::after{content:"\f078";margin-left:8px;font-family:"Font Awesome 6 Free";font-weight:900}
    .advanced-filter[open] summary{border-bottom:1px solid #e2e8ef;background:#f5f8fb}.advanced-filter[open] summary::after{content:"\f077"}
    .advanced-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:13px;padding:17px 18px}.advanced-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;padding-top:3px}
    /* Sidebar อ้างอิงรูปแบบ E-CMIS กิจกรรมที่ 9 แต่ใช้เฉพาะโมดูลคุ้มครองพยาน */
    .app{grid-template-columns:268px minmax(0,1fr)}
    .side{display:flex;flex-direction:column;height:100vh;overflow:hidden;padding:0;background:#0d1b3e;box-shadow:4px 0 18px rgba(13,27,62,.2)}
    .brand{min-height:92px;flex:0 0 auto;gap:13px;padding:17px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
    .brand .seal{width:56px;height:56px;flex:0 0 56px;border:2px solid #c99a2e;border-radius:50%;object-fit:cover;background:#f4d56d}
    .brand strong{color:#f7f9fd;font-size:20px;font-weight:700;letter-spacing:.02em}
    .brand small{display:block;margin-top:2px;color:#e4be52;font-size:10px;font-weight:600;letter-spacing:.11em}
    .real-nav{display:block;flex:1;overflow-y:auto;padding:18px 10px 24px}
    .real-nav .nav-module-label{display:flex;align-items:center;gap:11px;margin-bottom:6px;padding:12px;color:#e7bd4e;font-size:15px;font-weight:600}
    .real-nav .nav-module-label .icon{width:20px;color:#e7bd4e;text-align:center}
    .real-nav .nav-section-label{padding:14px 12px 6px;color:#91a2c3;font-size:11px;font-weight:600;letter-spacing:.04em}
    .real-nav button.nav-link{display:flex;width:100%;min-height:44px;align-items:center;gap:11px;margin:3px 0;padding:10px 12px 10px 38px;border:1px solid transparent;border-radius:7px;background:transparent;color:#cad5e9;font-size:13px;font-weight:500;text-align:left}
    .real-nav button.nav-link:hover,.real-nav button.nav-link:focus-visible{background:rgba(255,255,255,.07);color:#fff;outline:0}
    .real-nav button.nav-link.active{border-color:rgba(201,154,46,.4);background:rgba(201,154,46,.14);color:#f0c75a;box-shadow:none;font-weight:600}
    .real-nav button.nav-link.level-two{padding-left:55px;font-size:12px}
    .real-nav button.nav-link .icon{width:18px;color:#8fa1c6;text-align:center}
    .real-nav button.nav-link.active .icon{color:#f0c75a}
    .profile{flex:0 0 auto;margin:14px;padding:12px;border:0;border-radius:9px;background:rgba(255,255,255,.08)}
    .profile .avatar{width:38px;height:38px;flex:0 0 38px;background:#1d3975;color:#fff;font-weight:600}
    .profile strong{color:#fff;font-weight:600}.profile small{font-size:11px;color:#bac7dd}
    .top{height:68px;padding:0 24px;background:#fafbfe}.global-search{display:flex;align-items:center;gap:9px;min-height:42px;padding:9px 14px}
    .global-search i{color:#667a94}.collapse,.icon-btn{display:inline-grid;place-items:center}.icon-btn i,.collapse i{font-size:16px}
    .btn i{margin-right:7px}.btn.icon-only i{margin:0}
    .notification-dot{right:5px;top:5px;width:7px;height:7px}
    /* จัดกลุ่มฟิลด์ตามโครงสร้างของแบบ คบ.1 ฉบับจริง */
    .form-group-title{grid-column:1/-1;display:flex;align-items:center;gap:9px;margin-top:10px;padding:10px 2px 7px;border-bottom:1px solid #dbe4ee;color:#174f83;font-size:14px;font-weight:700}
    .form-group-title:first-child{margin-top:0}.form-group-title i{color:#c39b32}
    .field-help{display:block;margin-top:5px;color:#6a7a90;font-size:11px;line-height:1.45}
    .official-paper-wrap{position:relative}.official-page-counter{position:sticky;top:8px;z-index:4;display:flex;justify-content:flex-end;height:0;padding-right:8px;pointer-events:none}
    .official-page-counter span{display:inline-flex;align-items:center;height:30px;padding:0 11px;border:1px solid #d7e1eb;border-radius:999px;background:rgba(255,255,255,.95);color:#28486f;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(16,40,75,.08)}
    /* ลายมือชัดเจนว่าใครเป็นผู้ลงนามและใครเป็นผู้รับรอง */
    .signature-flow{grid-column:1/-1;display:grid;gap:14px}
    .signature-order{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-left:4px solid #c6a13d;border-radius:7px;background:#fff8e8;color:#58471d;font-size:12px;line-height:1.55}
    .signature-party{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px;border:1px solid #d8e2ec;border-radius:10px;background:#fff}
    .signature-party.completed{border-color:#a9d3b9;background:#f2faf5}.signature-party.pending{background:#fbfcfe}
    .signature-party-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#eaf2fb;color:#1d5a91;font-size:20px}
    .signature-party.completed .signature-party-icon{background:#dff2e6;color:#24714a}
    .signature-party h4{margin:0 0 3px;color:#172943;font-size:15px}.signature-party p{margin:0;color:#607188;font-size:12px;line-height:1.5}
    .signature-party dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 9px;margin:9px 0 0;font-size:11px}.signature-party dt{color:#718198}.signature-party dd{margin:0;color:#253a57;font-weight:600}
    .signature-party .btn{white-space:nowrap}.signature-revision-note{display:flex;align-items:center;gap:8px;color:#6a7586;font-size:11px}
    /* แท็บหน้าผู้ยื่นใช้งานได้ทุกขั้น */
    .public-steps button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:9px 10px;border:1px solid #d5e0eb;border-radius:8px;background:#e8edf3;color:#4d6079;font:600 12px "Kanit",sans-serif;cursor:pointer}
    .public-steps button:hover,.public-steps button:focus-visible{border-color:#6d97c1;background:#f5f9fd;color:#174f83;outline:3px solid rgba(29,90,145,.12)}
    .public-steps button.active{border-color:#a8c7e5;background:#dceafa;color:#174f83}.public-steps button.complete{border-color:#add2bd;background:#edf8f1;color:#24714a}
    .public-step-content{padding-top:20px}.public-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid #e1e8ef}.public-review{display:grid;grid-template-columns:minmax(0,1fr) minmax(430px,.85fr);gap:18px}.review-summary,.public-official-preview{min-width:0}.review-summary>div:not(.field){display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #e5ebf1}.review-summary>div span{color:#6a7a90}.review-summary>div strong{color:#172943}
    @media(max-width:1180px){.public-review{grid-template-columns:1fr}.signature-party{grid-template-columns:48px minmax(0,1fr)}.signature-party .btn{grid-column:1/-1;justify-self:end}}
    @media(max-width:560px){.signature-party{grid-template-columns:1fr}.signature-party-icon{width:42px;height:42px}.signature-party .btn{grid-column:auto;justify-self:stretch}.public-actions{align-items:stretch;flex-direction:column}.public-actions>.actions{width:100%}.public-actions .btn{flex:1}.review-summary>div:not(.field){grid-template-columns:1fr;gap:2px}}
    @media(max-width:1440px){.workspace{grid-template-columns:minmax(0,1fr) minmax(460px,.82fr)}.paper{font-size:14px}.paper.kb1-paper .doc-row{font-size:12px}}
    @media(max-width:1180px){.workspace{grid-template-columns:1fr}.paper-wrap{position:static;max-height:none}.paper{max-width:760px;margin:auto}.advanced-grid{grid-template-columns:repeat(2,1fr)}}
    /* จำลองแบบ คบ.1 ด้วย HTML บนอัตราส่วน A4 ค่าทุกค่าอยู่ใน document flow ไม่ใช้ overlay ลอย */
    .paper.kb1-paper{box-sizing:border-box;overflow:hidden;padding:5.2% 6.5% 5.8%;font-family:"TH Sarabun New","Sarabun","Thonburi",Tahoma,sans-serif;font-size:12px;line-height:1.42;box-shadow:0 3px 14px rgba(16,40,75,.16)}
    .paper.kb1-paper .secret-mark{font-size:17px;line-height:1;margin:0 0 3px}
    .paper.kb1-paper .doc-top{grid-template-columns:1fr 74px 1fr;margin:2px 0 7px}
    .paper.kb1-paper .doc-emblem img{width:49px;height:49px}
    .paper.kb1-paper .doc-meta{font-size:10.5px;line-height:1.45}
    .paper.kb1-paper .doc-title{margin:5px 0 9px;font-size:14px;line-height:1.35}
    .paper.kb1-paper .doc-section{margin:7px 0 3px;padding:0 0 2px;border-bottom:1px solid #6b7280;font-size:11.5px;line-height:1.35}
    .paper.kb1-paper .doc-row{margin:2px 0;font-size:10.5px;line-height:1.38}
    .paper.kb1-paper .fill{display:inline;border-bottom:1px dotted #505968;color:#172943;font-weight:700;padding:0 3px;white-space:normal;overflow-wrap:anywhere}
    .paper.kb1-paper .box{width:10px;height:10px;margin:0 2px;vertical-align:-1px}
    .paper.kb1-paper .box.checked::after{margin-top:-5px;font-size:13px}
    .paper.kb1-paper .id-boxes{gap:1px}.paper.kb1-paper .id-box{width:11px;height:13px;font-size:8px}
    .paper.kb1-paper .doc-note{margin:5px 0;padding:5px 7px;border-left:0;border:1px solid #c7ced7;background:#fff;font-size:9.5px;line-height:1.4;white-space:pre-wrap}
    .paper.kb1-paper .doc-lines{height:11px;margin:2px 0}
    .paper.kb1-paper .doc-signatures{gap:24px;margin-top:18px;font-size:10px;line-height:1.45}
    .paper.kb1-paper .doc-footer{right:6.5%;bottom:2.8%;font-size:9px}.paper.kb1-paper .secret-bottom{bottom:.8%;font-size:15px}
    .paper.kb1-paper .signature-status{margin-top:3px;padding:2px 5px;font-size:8px}
    .signature-capture{display:grid;grid-template-columns:minmax(170px,1fr) minmax(170px,.8fr);gap:12px;margin-top:12px}
    .signature-canvas{display:grid;place-items:center;min-height:92px;border:1px dashed #8ea3bb;border-radius:8px;background:#fbfdff;color:#70839a;text-align:center}
    .signature-canvas i{display:block;margin-bottom:5px;color:#1d5a91;font-size:24px}.signature-canvas.complete{border-style:solid;border-color:#9bc8ad;background:#f2faf5;color:#24714a}
    .signature-proof{display:grid;align-content:center;gap:5px;padding:10px 12px;border-radius:8px;background:#f3f6fa;font-size:11px}.signature-proof strong{color:#173e70}.signature-proof span{color:#61738a}
    @media(max-width:1440px){.paper.kb1-paper .doc-row{font-size:10.25px;line-height:1.5}.paper.kb1-paper .doc-section{font-size:11px;line-height:1.45}.paper.kb1-paper .doc-title{font-size:13px}.paper.kb1-paper .doc-note{font-size:9.5px;line-height:1.5}}
    @media(max-width:680px){.signature-capture{grid-template-columns:1fr}}
    /* ให้ฟอร์มและกระดาษเริ่มที่แนวเดียวกัน และเลื่อนตามหน้าไปพร้อมกัน */
    .form-page .workspace{align-items:start}
    .form-page .form-panel,.form-page .paper-wrap{align-self:start;margin-top:0}
    .form-page .paper-wrap{position:relative;top:auto;padding:0}
    .form-page .paper.kb1-paper{border-radius:9px 9px 0 0}
    .form-page .official-page-switcher{padding:12px}
    /* รวมแถบข้อมูลแฟ้มกับแท็บหัวข้อเป็นองค์ประกอบเดียว มุมไม่ชนกัน */
    .form-page .case-context{margin:0;border-radius:10px 10px 0 0}
    .form-page .form-tabs-shell{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:stretch;margin:0;border:1px solid #dbe3eb;border-top:0;border-radius:0 0 10px 10px;background:#fbfdff;overflow:hidden}
    .form-page .form-tabs{position:relative;min-width:0;overflow-x:auto;overflow-y:hidden;margin:0;border:0;border-radius:0;padding:12px 6px;scrollbar-width:thin;scrollbar-color:#9cacbf #edf2f7;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
    .form-page .form-tabs::-webkit-scrollbar{height:7px}
    .form-page .form-tabs::-webkit-scrollbar-track{border-radius:999px;background:#edf2f7}
    .form-page .form-tabs::-webkit-scrollbar-thumb{border-radius:999px;background:#9cacbf}
    .form-page .form-tabs button{flex:0 0 auto;scroll-snap-align:start}
    .form-page .tab-scroll{display:grid;place-items:center;border:0;background:#f4f7fa;color:#31577f;cursor:pointer}
    .form-page .tab-scroll:first-child{border-right:1px solid #e0e7ef}.form-page .tab-scroll:last-child{border-left:1px solid #e0e7ef}
    .form-page .tab-scroll:hover,.form-page .tab-scroll:focus-visible{background:#e8f1fa;color:#124f86;outline:0}

  ['3. บุคคลที่สามารถติดต่อได้',['@group:ข้อมูลบุคคลติดต่อ','คำนำหน้าบุคคลติดต่อ','ชื่อบุคคลติดต่อ','นามสกุลบุคคลติดต่อ','@group:ที่อยู่และช่องทางติดต่อ','บ้านเลขที่บุคคลติดต่อ','หมู่บุคคลติดต่อ','อาคารหรือหมู่บ้านบุคคลติดต่อ','ซอยบุคคลติดต่อ','ถนนบุคคลติดต่อ','ตำบลหรือแขวงบุคคลติดต่อ','อำเภอหรือเขตบุคคลติดต่อ','จังหวัดบุคคลติดต่อ','รหัสไปรษณีย์บุคคลติดต่อ','โทรศัพท์บุคคลติดต่อ','สถานที่ทำงานบุคคลติดต่อ','โทรศัพท์ที่ทำงานบุคคลติดต่อ']],

  ['3. หนังสือสำคัญแสดงตน',['ชนิดหนังสือสำคัญแสดงตน','หมายเลขหนังสือสำคัญแสดงตน','ออกให้ที่','วันออกหนังสือสำคัญแสดงตน','วันสิ้นอายุหนังสือสำคัญแสดงตน']],

function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function base(title,description,actions=''){return `<div class="breadcrumb">กิจกรรมที่ 6 <b>›</b> ระบบคุ้มครองพยาน</div><header class="page-head"><div><h1>${title}</h1><p>${description}</p></div><div class="actions">${actions}</div></header>`}
function badge(c){const cls=c.stage==='protection'?'success':c.stage==='appeal'?'warning':c.stage==='external_pending'?'danger':'';return `<span class="badge ${cls}">${c.status}</span>`}
function caseRows(items,showReturnNote=false){return items.map(c=>{const urgent=isUrgentCase(c),rowClass=urgent?'urgent-case-row':'',caseType=urgent?'<span class="urgent-label"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>กรณีจำเป็นเร่งด่วน</span>':'กรณีปกติ',withdrawalTag=c.withdrawal?`<span class="withdrawal-label ${c.hasKb5?'kb5':''}"><i class="fa-solid ${c.hasKb5?'fa-shield-halved':'fa-file-circle-minus'}" aria-hidden="true"></i>${c.hasKb5?'ถอนคำร้องหลัก · คบ.5 ยังมีผล':'ถอนคำร้องก่อนมีคำสั่ง'}</span>`:'',targetRoute=c.caseRoute||(urgent&&c.no==='WP-2569-000483'&&['staff_review','supervisor_review','director_review'].includes(c.stage)?'case-urgent-kb2':'case'),hasActivity7=Boolean(c.activity7State),activity7Reference=c.externalReference||'รอเลขอ้างอิงกิจกรรมที่ 7',activity7Date=c.resultAt?`รับผล ${c.resultAt}`:`ส่งเมื่อ ${c.sentAt||'-'}`,approvalStep=Number.isInteger(c.approvalStep)?c.approvalStep:0,approvalProgress=Math.min(approvalStep+1,8),activity7Meta=hasActivity7?`<div class="registry-a7-meta"><button class="registry-a7-reference" data-activity7-package="${esc(c.no)}" title="เปิดชุดข้อมูลที่ส่งกิจกรรมที่ 7"><i class="fa-solid fa-box-archive" aria-hidden="true"></i>${esc(activity7Reference)}</button><small>${esc(activity7Date)}</small></div>`:'',approvalMeta=c.activity7State==='approved'?`<div class="registry-a7-progress"><span>ขั้นหลังอนุมัติ ${approvalProgress}/8</span><span class="registry-a7-track" aria-label="ดำเนินการแล้ว ${approvalProgress} จาก 8 ขั้น"><i style="width:${approvalProgress/8*100}%"></i></span></div>`:'',activity7Action=c.activity7State==='pending'?`<button class="btn primary-action" data-activity7-result="${esc(c.no)}"><i class="fa-solid fa-inbox" aria-hidden="true"></i>บันทึกรับผล</button>`:c.activity7State==='approved'?`<button class="btn primary-action" data-activity7-next="${esc(c.no)}"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i>${esc(approvalActionLabels[approvalStep]||'เปิดงานคุ้มครอง')}</butto function bindReturnWorkflow(){
 document.querySelectorAll('[data-case-no]').forEach(button=>button.onclick=()=>{activeCaseNo=button.dataset.caseNo||'';go(button.dataset.go)});
 const category=document.querySelector('[data-return-category]'),target=document.querySelector('[data-return-target]'),routeText=document.querySelector('[data-return-route]');
 const updateTarget=()=>{if(!category||!target||!routeText)return;const option=category.selectedOptions[0],isSupervisor=option?.dataset.target==='supervisor';target.textContent=isSupervisor?'ผู้บังคับบัญชาชั้นต้น':'เจ้าหน้าที่เจ้าของเรื่อง';routeText.textContent=isSupervisor?'แก้ความเห็นแล้วส่ง ผอ.สำนัก/กองอีกครั้ง':'แก้ไขแล้วส่งผู้บังคับบัญชาชั้นต้นตรวจทานใหม่'};
 if(category){category.onchange=updateTarget;updateTarget()}
 document.querySelectorAll('[data-return-submit]').forEach(button=>button.onclick=()=>{const level=button.dataset.returnSubmit,type=document.querySelector('[data-return-type]')?.value||'revision',selected=category?.selectedOptions[0],detail=document.querySelector('[data-return-detail]')?.value.trim()||'',due=document.querySelector('[data-return-due]')?.value||'',targetRole=selected?.dataset.target||'officer',issuer=level==='director'?'ผอ.สำนัก/กอง':'ผู้บังคับบัญชาชั้นต้น';if(!detail){Swal.fire({icon:'warning',title:'กรุณาระบุรายละเอียดที่ต้องดำเนินการ',text:'ระบุข้อมูลที่ต้องแก้ไขหรือรายการเอกสารที่ต้องขอให้ชัดเจน',confirmButtonText:'ตกลง',confirmButtonColor:'#1d5a91'});return}Swal.fire({icon:'question',title:type==='documents'?'ยืนยันขอเอกสารเพิ่มเติม':'ยืนยันตีกลับแก้ไข',html:`ระบบจะสร้างงานให้ <b>${targetRole==='supervisor'?'ผู้บังคับบัญชาชั้นต้น':'เจ้าหน้าที่เจ้าของเรื่อง'}</b><br>และบันทึกคำสั่งไว้ในประวัติแฟ้ม`,showCancelButton:true,confirmButtonText:'ยืนยันส่งกลับ',cancelButtonText:'ตรวจสอบอีกครั้ง',confirmButtonColor:'#a24343',cancelButtonColor:'#718198',reverseButtons:true,customClass:{popup:'ecmis-swal'}}).then(result=>{if(!result.isConfirmed)return;const caseItem=demoCases.find(c=>c.no===(activeCaseNo||(level==='director'?'WP-2569-000485':'WP-2569-000484')));activeReturnInstruction={issuer,target:targetRole,type,issueLabel:selected?.textContent||'แก้ไขข้อมูล',detail,due};if(caseItem){activeCaseNo=caseItem.no;caseItem.returned=true;caseItem.ready=false;caseItem.status=type==='documents'?'รอเอกสารเพิ่มเติม':'ส่งกลับแก้ไข';caseItem.stage=targetRole==='supervisor'?'supervisor_review':'staff_review';caseItem.owner=targetRole==='supervisor'?'นายกิตติศักดิ์ ธรรมรักษ์':'นางสาวอรุณี ใจมั่น';caseItem.next=targetRole==='supervisor'?'แก้ความเห็นและส่ง ผอ.สำนัก/กองพิจารณาใหม่':'แก้ไขแล้วส่งผู้บังคับบัญชาชั้นต้นตรวจใหม่';caseItem.caseRoute='case-correction'}successAlert('บันทึกคำสั่งส่งกลับแล้ว',targetRole==='supervisor'?'สร้างงานให้ผู้บังคับบัญชาชั้นต้นแก้ไขและส่ง ผอ. ใหม่':'สร้างงานให้เจ้าหน้าที่ และแจ้งผู้บังคับบัญชาชั้นต้นเพื่อทราบ',()=>go(targetRole==='supervisor'?'queue-supervisor':'queue-officer'))})});
document.querySelectorAll('[data-forward-review]').forEach(button=>button.onclick=()=>{const level=button.dataset.forwardReview,caseItem=demoCases.find(c=>c.no===(activeCaseNo||(level==='director'?'WP-2569-000485':'WP-2569-000484'))),destination=level==='director'?'กิจกรรมที่ 7':'ผอ.สำนัก/กอง';Swal.fire({icon:'question',title:`ยืนยันส่ง ${destination}`,text:'ระบบจะบันทึกความเห็นและส่งแฟ้มเข้าสู่คิวถัดไป',showCancelButton:true,confirmButtonText:'ยืนยันส่ง',cancelButtonText:'ตรวจสอบอีกครั้ง',confirmButtonColor:'#1d5a91',cancelButtonColor:'#718198',reverseButtons:true}).then(result=>{if(!result.isConfirmed)return;if(caseItem){caseItem.returned=false;caseItem.stage=level==='director'?'external_pending':'director_review';caseItem.status=level==='director'?'รอผลกิจกรรมที่ 7':'รอ ผอ.พิจารณา';caseItem.owner=level==='director'?'นางสาวอรุณี ใจมั่น':'นางสาวพิมพ์ชนก วัฒนกิจ';caseItem.next=level==='director'?'ติดตามและบันทึกรับผลในทะเบียนคำร้อง':'พิจารณาแฟ้มหลังผู้บังคับบัญชากลั่นกรอง';caseItem.caseRoute=level==='director'?'case':'case-return-director'}successAlert(`ส่ง ${destination} แล้ว`,'แฟ้มเข้าสู่คิวถัดไปพร้อมประวัติการดำเนินงาน',()=>go(level==='director'?'registry':'queue-director'))})});
 document.querySelectorAll('[data-correction-submit]').forEach(button=>button.onclick=()=>{const item=demoCases.find(c=>c.no===(activeCaseNo||'WP-2569-000464')),forOfficer=(activeReturnInstruction?.target||'officer')==='officer';Swal.fire({icon:'question',title:forOfficer?'ยืนยันส่งผู้บังคับบัญชาตรวจใหม่':'ยืนยันส่ง ผอ.สำนัก/กองพิจารณาใหม่',text:forOfficer?'แฟ้มจะกลับเข้าคิวผู้บังคับบัญชาชั้นต้นก่อนถึง ผอ.':'ความเห็นที่แก้ไขจะถูกบันทึกเป็นรายการใหม่และส่ง ผอ.',showCancelButton:true,confirmButtonText:'ยืนยันส่ง',cancelButtonText:'ตรวจสอบอีกครั้ง',confirmButtonColor:'#1d5a91',cancelButtonColor:'#718198',reverseButtons:true}).then(result=>{if(!result.isConfirmed)return;if(item){item.returned=false;item.stage=forOfficer?'supervisor_review':'director_review';item.status=forOfficer?'รอตรวจทานหลังแก้ไข':'รอ ผอ.พิจารณาใหม่';item.owner=forOfficer?'นายกิตติศักดิ์ ธรรมรักษ์':'นางสาวพิมพ์ชนก วัฒนกิจ';item.next=forOfficer?'ตรวจทานการแก้ไขก่อนส่ง ผอ.สำนัก/กอง':'พิจารณาแฟ้มที่แก้ไขแล้ว';item.caseRoute=forOfficer?'case-return-supervisor':'case-return-director'}successAlert('ส่งงานแก้ไขแล้ว',forOfficer?'แฟ้มเข้าสู่คิวผู้บังคับบัญชาชั้นต้นตามลำดับเดิม':'แฟ้มกลับเข้าสู่คิว ผอ.สำนัก/กอง',()=>go(forOfficer?'queue-supervisor':'queue-director'))})});
 document.querySelectorAll('[data-request-witness-docs]').forEach(button=>button.onclick=()=>Swal.fire({icon:'question',title:'บันทึกการขอเอกสารจากพยาน',html:'เจ้าหน้าที่จะเป็นผู้ติดต่อพยาน และเอกสารที่ได้รับจะผูกกับแฟ้มนี้',showCancelButton:true,confirmButtonText:'บันทึกการติดต่อ',cancelButtonText:'ยกเลิก',confirmButtonColor:'#1d5a91',cancelButtonColor:'#718198'}).then(result=>{if(result.isConfirmed)successAlert('บันทึกการติดต่อแล้ว','ระบบเพิ่มรายการติดตามเอกสารและ Audit Log ในแฟ้ม')}));
}

function choiceHtml(label,type,options){const saved=String(formDraft[label]??sampleValue(label,0));return `<div class="choice-group"><label>${label} *</label><div class="choice-options">${options.map((option,index)=>{const selected=type==='radio'?saved===option:saved.split('|').includes(option)||(!formDraft[label]&&index===0);return `<label class="choice"><input type="${type}" name="${esc(label)}" value="${esc(option)}" data-choice-field="${esc(label)}" ${selected?'checked':''}> <span>${option}</span></label>`}).join('')}</div></div>`}
function signatureHtml(f,signer){if(f.n===1){const petitioner=fullName('คำนำหน้าผู้ยื่นคำร้อง','ชื่อผู้ยื่นคำร้อง','นามสกุลผู้ยื่นคำร้อง');return `<section class="signature-step"><header class="signature-head"><div><em>ขั้นสุดท้ายของแบบ คบ.1</em><h3>ลงลายมือชื่อตามลำดับ</h3><p>ผู้ยื่นรับรองข้อมูลก่อน จากนั้นเจ้าพนักงานผู้รับคำร้องจึงตรวจสอบและรับรอง</p></div><span class="badge ${signed?'success':'warning'}">${signed?'ครบ 2 ฝ่าย':'รอลงนาม'}</span></header><div class="signature-flow"><div class="signature-order"><i class="fa-solid fa-arrow-down-1-9"></i><span><strong>ลำดับลงนาม:</strong> 1) ผู้ยื่นคำร้องลงนามบนหน้าจอ 2) เจ้าพนักงานผู้รับคำร้องตรวจตัวตนและรับรองด้วยบัญชีราชการ</span></div>${signatureParty(1,'ผู้ยื่นคำร้อง',petitioner,'รับรองความถูกต้องของคำร้อง','ลงลายมือชื่อบนหน้าจอ',petitionerSigned,'sign-petitioner',false)}${signatureParty(2,'เจ้าพนักงานผู้รับคำร้อง','นางสาวอรุณี ใจมั่น','นักสืบสวนสอบสวนชำนาญการ','บัญชีผู้ใช้งานราชการ',officerSigned,'sign-officer',!petitionerSigned)}<div class="signature-revision-note"><i class="fa-solid fa-clock-rotate-left"></i>การแก้ไขข้อมูลหลังลงนามจะสร้างเอกสารรุ่นใหม่และต้องลงนามใหม่ทั้งสองฝ่าย</div></div></section>`}return `<section class="signature-step"><header class="signature-head"><div><em>ขั้นลงลายมือชื่อ คบ.${f.n}</em><h3>${signer}</h3><p>ระบบอ่านบุคคลจากบัญชีผู้ใช้งานและขั้นตอนปัจจุบัน ไม่มีรายชื่อให้เลือกลงนามแทน</p></div><span class="badge ${signed?'success':'warning'}">${signed?'ลงนามแล้ว':'รอลงนาม'}</span></header><div class="signature-action"><span>ลงนามด้วยบัญชี ${roleNames[currentRole]}</span><button class="btn gold" data-action="sign" ${signed?'disabled':''}><i class="fa-solid fa-file-signature"></i>${signed?'ลงนามแล้ว':'ยืนยันและลงลายมือชื่อ'}</button></div></section>`}

function showReturnDetailPopup(item){Swal.fire({icon:'warning',title:'แฟ้มนี้ถูกส่งกลับแก้ไข',html:`<div style="text-align:left"><p style="margin:0 0 10px"><b>ส่งกลับโดย:</b> ${esc(item.returnedBy||'-')}</p><p style="margin:0 0 10px"><b>ประเด็นที่ต้องแก้ไข:</b> ${esc(item.returnIssueLabel||'-')}</p><p style="margin:0 0 10px"><b>รายละเอียด:</b><br>${esc(item.returnNote||'-')}</p>${item.returnDue?`<p style="margin:0"><b>กำหนดส่งกลับ:</b> ${esc(item.returnDue)}</p>`:''}</div>`,confirmButtonText:'รับทราบ',confirmButtonColor:'#1d5a91',customClass:{popup:'ecmis-swal'}})}
let lastReturnPopupCaseNo=null;
function autoShowReturnDetail(){
 const route=location.hash.replace(/^#\//,'')||'registry';
 if(route!=='case'&&route!=='case-urgent-kb2'){lastReturnPopupCaseNo=null;return}
 if(currentRole!=='officer'&&currentRole!=='supervisor')return;
 const item=currentCaseItem();
 if(!item||!item.returned||!item.returnedBy||item.no===lastReturnPopupCaseNo)return;
 lastReturnPopupCaseNo=item.no;

}
function withdrawalSteps(items,currentIndex=1){return `<div class="withdrawal-steps">${items.map((item,index)=>`<div class="withdrawal-step ${index<currentIndex?'done':index===currentIndex?'current':''}">${index+1}. ${item}</div>`).join('')}</div>`}
function withdrawalProgress(item){
 const status=item?.status||'';
 if(status.includes('ปิดแฟ้ม')||status.includes('สิ้นสุด'))return 12;
 if(status.includes('รอบันทึก')||status.includes('หลักฐานการรับ'))return 11;
 if(status.includes('รอแจ้งผล')||status.includes('จัดทำหนังสือแจ้งผล'))return 10;
 if(status.includes('รับผล'))return 9;
 if(status.includes('รอผล')||item?.stage==='external_pending')return 8;
 if(status.includes('ผอ.')||item?.stage==='director_review')return 7;
 if(status.includes('กลั่นกรอง')||item?.stage==='supervisor_review')return 6;
 if(status.includes('คบ.6'))return 5;
 if(status.includes('คบ.3'))return 3;
 return item?.withdrawal?2:0;
}

function activity7ResultRow(item){const [label,icon]=activity7StateMeta(item),canReceive=item.activity7State==='pending',isApproved=item.activity7State==='approved';return `<article class="activity7-result-row"><div class="activity7-result-main"><div><h3><button class="case-link" data-track-case="${esc(item.no)}">${esc(item.no)}</button> · ${esc(item.form)}</h3><p>${esc(item.person)} · เจ้าหน้าที่เจ้าของเรื่อง ${esc(item.assignedOfficer||item.owner)}</p></div><div class="activity7-reference"><strong>${esc(item.externalReference||'รอเลขอ้างอิง')}</strong><small>${item.resultAt?'รับผล '+esc(item.resultAt):'ส่งเมื่อ '+esc(item.sentAt||'-')}</small></div><div><span class="activity7-state ${item.activity7State}"><i class="fa-solid ${icon}"></i>${label}</span><p>${esc(item.next||'ติดตามผลในทะเบียนคำร้อง')}</p></div><div class="activity7-result-actions"><button class="btn secondary" data-activity7-package="${esc(item.no)}"><i class="fa-solid fa-box-archive"></i>ชุดข้อมูล</button>${canReceive?`<button class="btn" data-activity7-result="${esc(item.no)}"><i class="fa-solid fa-inbox"></i>บันทึกรับผล</button>`:''}${isApproved?`<button class="btn" data-activity7-next="${esc(item.no)}"><i class="fa-solid fa-arrow-right"></i>${approvalActionLabels[item.approvalStep||0]}</button>`:''}</div></div>${isApproved?approvalLifecycleHtml(item):''}</article>`}
function activity7RegistryPanel(){const items=activity7Cases(),states=[['pending','รอผล'],['returned','ส่งกลับแก้ไข'],['rejected','ไม่อนุมัติ'],['approved','อนุมัติ'],['committee','ส่งต่อภายนอก']];return `<section class="card activity7-registry"><header class="activity7-registry-head"><div><h2>ส่ง–รับผลกิจกรรมที่ 7</h2><p>ติดตามเลขอ้างอิง บันทึกผล และสร้างงานต่อในทะเบียนคำร้อง กิจกรรมที่ 6 ไม่สร้างหน้าพิจารณาของเลขาธิการขึ้นใหม่</p></div><i class="fa-solid fa-right-left"></i></header><div class="activity7-registry-kpis">${states.map(([state,label])=>`<div class="activity7-kpi"><span>${label}</span><strong>${items.filter(item=>item.activity7State===state).length}</strong><small>รายการ</small></div>`).join('')}</div><div class="activity7-result-list">${items.map(activity7ResultRow).join('')}</div></section>`}
function showActivity7Package(item){const documents=['คบ.1 หรือ คบ.2','คบ.3','คบ.6 พร้อมความเห็นตามลำดับ','เอกสารหลักฐานภัยคุกคาม','ผลเชื่อมโยงคดีหลักและสถานะพยาน','ผลประเมินความเสี่ยง','วิธีคุ้มครอง ระยะเวลา ทีม และงบประมาณที่เสนอ'];if(item.form==='คบ.2')documents.push('คบ.5 และรายงานคุ้มครองชั่วคราว (ถ้ามี)');Swal.fire({title:`ชุดข้อมูล ${item.no}`,html:`<div class="activity7-package-list">${documents.map(text=>`<div class="activity7-package-item"><i class="fa-solid fa-circle-check"></i><span>${text}</span></div>`).join('')}</div>`,confirmButtonText:'ปิด',confirmButtonColor:'#1d5a91',width:700})}
function openActivity7ResultDialog(item){Swal.fire({icon:'question',title:'บันทึกรับผลจากกิจกรรมที่ 7',html:`<div class="activity7-dialog"><div><label>ผลพิจารณา *</label><select id="activity7-result"><option value="approved">อนุมัติ พร้อมคำสั่ง คบ.8 ที่ลงนามแล้ว</option><option value="rejected">ไม่อนุมัติ</option><option value="returned">ส่งกลับแก้ไข</option><option value="committee">มติให้ประสานหน่วยงานภายนอก</option></select></div><div><label>เลขอ้างอิงผล *</label><input id="activity7-reference" value="${esc(item.externalReference||'')}" /></div><div><label>หมายเหตุจากผลพิจารณา</label><textarea id="activity7-note" placeholder="ระบุเหตุผล ข้อสั่งการ หรือประเด็นที่ต้องดำเนินการต่อ"></textarea></div></div>`,showCancelButton:true,confirmButtonText:'ยืนยันรับผล',cancelButtonText:'ยกเลิก',confirmButtonColor:'#1d5a91',cancelButtonColor:'#718198',reverseButtons:true,preConfirm:()=>{const result=document.getElementById('activity7-result')?.value,reference=document.getElementById('activity7-reference')?.value.trim(),note=document.getElementById('activity7-note')?.value.trim();if(!reference){Swal.showValidationMessage('กรุณาระบุเลขอ้างอิงผล');return false}return{result,reference,note}}}).then(response=>{if(!response.isConfirmed)return;const {result,reference,note}=response.value;item.activity7State=result;item.activity7Label=activity7StateMeta({activity7State:result})[0];item.externalReference=reference;item.resultAt='05/08/2569 14:25';item.resultNote=note;item.owner=item.assignedOfficer||item.owner;if(result==='approved'){item.status='อนุมัติแล้ว · รอจัดทำ คบ.9';item.next='ตรวจคำสั่ง คบ.8 และจัดทำ คบ.9';item.kb8Signed=true;item.approvalStep=0}else if(result==='rejected'){item.status='รับผลไม่อนุมัติ · รอจัดทำ คบ.10';item.next='จัดทำ คบ.10 และแจ้งสิทธิอุทธรณ์'}else if(result==='returned'){item.status='เลขาธิการคณะกรรมการ ป.ป.ท. ส่งกลับแก้ไข';item.stage='staff_review';item.next='แก้ไขข้อเท็จจริงตามที่เลขาธิการคณะกรรมการ ป.ป.ท. ระบุ แล้วส่งตามลำดับชั้นใหม่'}else{item.status='รับมติให้ประสานหน่วยงานภายนอก';item.next='ประสานหน่วยงานปลายทาง และจัดทำ คบ.12 เมื่อส่งมอบ'}successAlert('บันทึกรับผลแล้ว',`ระบบตรวจเลขคำร้องและ Assignment แล้วสร้างงานให้ ${item.owner} พร้อมแจ้งผู้บังคับบัญชาและ ผอ.เพื่อรับทราบ`,()=>render())})}
function approvalActionDialog(item){const step=item.approvalStep||0;if(step===7){go('protection');return}const action=approvalActionLabels[step];let html='';if(step===0)html=`<div class="activity7-dialog"><div><label>ช่องทางแจ้งผล *</label><select id="approval-channel"><option value="อีเมลและหนังสือตาม">อีเมลและหนังสือตาม</option><option value="ไปรษณีย์ตอบรับ">ไปรษณีย์ตอบรับ</option><option value="ส่งโดยตรง">ส่งโดยตรง</option></select></div><div><label>อีเมลหรือเลขติดตาม</label><input id="approval-delivery-reference" placeholder="เช่น witness@example.test หรือ TH123456789TH" /></div></div>`;else if(step===1)html=`<div class="activity7-dialog"><div><label>วันที่และเวลาพยานได้รับ คบ.9 *</label><input id="approval-received-at" type="datetime-local" value="2026-08-05T14:30" /></div><div><label>หลักฐานการรับ *</label><input id="approval-proof" value="ใบตอบรับ/ลายมือชื่อผู้รับ" /></div></div>`;else if(step===2)html=`<div class="activity7-dialog"><div><label>การยืนยันของพยาน *</label><select id="approval-kb11"><option value="signed">รับทราบเงื่อนไขและลงนาม คบ.11</option><option value="declined">ยังไม่ยินยอมลงนาม</option></select></div></div>`;Swal.fire({icon:'question',title:action,html:html||`<p>ระบบจะบันทึกขั้นตอน “${action}” พร้อมผู้ดำเนินการ วันเวลา และ Audit Log</p>`,showCancelButton:true,confirmButtonText:'ยืนยันดำเนินการ',cancelButtonText:'ยกเลิก',confirmButtonColor:'#1d5a91',cancelButtonColor:'#718198',reverseButtons:true,preConfirm:()=>{if(step===1&&(!document.getElementById('approval-received-at')?.value||!document.getElementById('approval-proof')?.value.trim())){Swal.showValidationMessage('กรุณาระบุวันรับและหลักฐานการรับ');return false}if(step===2&&document.getElementById('approval-kb11')?.value==='declined'){Swal.showValidationMessage('พยานยังไม่ยินยอม จึงยังไม่สามารถมอบหมายชุดคุ้มครองได้');return false}return{channel:document.getElementById('approval-channel')?.value,reference:document.getElementById('approval-delivery-reference')?.value,receivedAt:document.getElementById('approval-received-at')?.value,proof:document.getElementById('approval-proof')?.value}}}).then(result=>{if(!result.isConfirmed)return;if(step===0){item.deliveryChannel=result.value.channel;item.deliveryReference=result.value.reference}if(step===1){item.noticeReceivedAt=result.value.receivedAt;item.noticeProof=result.value.proof}item.approvalStep=step+1;const states=[null,['รอหลักฐานการรับ คบ.9','บันทึกวันรับและหลักฐานการรับ คบ.9'],['รอพยานลงนาม คบ.11','นัดพยานรับทราบเงื่อนไขและลงนาม คบ.11'],['รอมอบหมายชุดคุ้มครอง','จัดทำ Assignment ตามรายชื่อใน คบ.8'],['รอชุดคุ้มครองรับงาน','หัวหน้าชุดเปิดรับคำสั่งและตรวจรายชื่อทีม'],['ชุดคุ้มครองรับงานแล้ว','จัดเตรียมแผน กำลังพล รถ อุปกรณ์ สถานที่ และงบประมาณ'],['พร้อมเริ่มปฏิบัติงาน','เจ้าหน้าที่เจ้าของเรื่องตรวจความพร้อมและบันทึกเริ่มงาน'],['กำลังคุ้มครอง','ชุดคุ้มครองปฏิบัติงานและจัดทำ คบ.13']];const current=states[item.approvalStep];if(current){item.status=current[0];item.next=current[1]}if(item.approvalStep===4)item.owner='ร.ต.อ. ณัฐวุฒิ พิทักษ์ธรรม';if(item.approvalStep===6)item.owner='นางสาวอรุณี ใจมั่น';if(item.approvalStep===7){item.stage='protection';item.owner='ชุดคุ้มครองตามคำสั่ง คบ.8'}successAlert('บันทึกขั้นตอนแล้ว',item.approvalStep<4?'งานยังอยู่กับเจ้าหน้าที่เจ้าของเรื่อง ชุดคุ้มครองยังไม่ได้รับ Assignment':'ระบบบันทึก Assignment และส่งเฉพาะข้อมูลที่จำเป็นต่อการปฏิบัติงาน',()=>render())})}
function bindActivity7Registry(){document.querySelectorAll('[data-activity7-package]').forEach(button=>button.onclick=()=>{const item=demoCases.find(entry=>entry.no===button.dataset.activity7Package);if(item)showActivity7Package(item)});document.querySelectorAll('[data-activity7-result]').forEach(button=>button.onclick=()=>{const item=demoCases.find(entry=>entry.no===button.dataset.activity7Result);if(item)openActivity7ResultDialog(item)});document.querySelectorAll('[data-activity7-next]').forEach(button=>button.onclick=()=>{const item=demoCases.find(entry=>entry.no===button.dataset.activity7Next);if(item)approvalActionDialog(item)})}
const registryBeforeUnifiedActivity7=registry;
registry=function(){return registryBeforeUnifiedActivity7()};
const renderBeforeUnifiedActivity7=render;

};
document.getElementById('role').onchange=e=>{currentRole=e.target.value;const target=roleRoutes[currentRole]||'registry';toast('เปลี่ยนบทบาทเป็น '+roleNames[currentRole]);if((location.hash.replace(/^#\//,'')||'registry')===target)render();else go(target)};window.addEventListener('hashchange',()=>{formSection=0;manualKb1Page=null;manualKb3Page=null;manualKb6Page=null;render()});render();
