  <style id="kb1-preview-upgrade">

    .paper.kb1-paper .doc-section{margin:13px 0 7px;padding-bottom:4px;border-bottom:1px solid #647184;font-size:15px;font-weight:900}
    .paper.kb1-paper .doc-subrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

    .paper.kb1-paper .signature-status.complete{background:#e7f5ec;color:#24714a}
    .paper.kb1-paper .doc-note{margin:10px 0;padding:8px 10px;border-left:3px solid #c6a13d;background:#fff9ea;font-size:11px;line-height:1.55}
    .public-official-preview .paper.kb1-paper{min-height:720px;aspect-ratio:210/297;box-shadow:0 5px 18px rgba(16,40,75,.12)}
    .public-official-preview .official-page-switcher{margin-top:10px}
    .choice-group{grid-column:1/-1}.choice-group>label{display:block;margin-bottom:7px;color:#34465f;font-size:12px;font-weight:800}
    .choice-options{display:flex;flex-wrap:wrap;gap:8px 18px;padding:11px 12px;border:1px solid #cbd6e2;border-radius:8px;background:#f8fafc}
    .choice{display:flex;align-items:flex-start;gap:7px;line-height:1.45}.choice input{width:auto;min-height:auto;margin-top:3px}
    .terms-list{display:grid;gap:9px}.terms-list .choice{padding:9px 10px;border-radius:7px;background:#f2f6fa}
    .address-heading{grid-column:1/-1;margin-top:4px;padding-bottom:5px;border-bottom:1px solid #e2e8ef;color:#174f83;font-weight:900}

    .advanced-filter summary{cursor:pointer;padding:13px 18px;color:#16558f;font-weight:900;list-style:none}.advanced-filter summary::-webkit-details-marker{display:none}.advanced-filter summary::after{content:"\f078";margin-left:8px;font-family:"Font Awesome 6 Free";font-weight:900}
    .advanced-filter[open] summary{border-bottom:1px solid #e2e8ef;background:#f5f8fb}.advanced-filter[open] summary::after{content:"\f077"}
    .advanced-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:13px;padding:17px 18px}.advanced-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;padding-top:3px}
    /* Sidebar อ้างอิงรูปแบบ E-CMIS กิจกรรมที่ 9 แต่ใช้เฉพาะโมดูลคุ้มครองพยาน */
    .app{grid-template-columns:268px minmax(0,1fr)}
    .side{display:flex;flex-direction:column;height:100vh;overflow:hidden;padding:0;background:#0d1b3e;box-shadow:4px 0 18px rgba(13,27,62,.2)}
    .brand{min-height:92px;flex:0 0 auto;gap:13px;padding:17px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
    .brand .seal{width:56px;height:56px;flex:0 0 56px;border:2px solid #c99a2e;border-radius:50%;object-fit:cover;background:#f4d56d}
    .brand strong{color:#f7f9fd;font-size:20px;font-weight:700;letter-spacing:.02em}
    .brand small{display:block;margin-top:2px;color:#e4be52;font-size:10px;font-weight:600;letter-spacing:.11em}
    .real-nav{display:block;flex:1;overflow-y:auto;padding:18px 10px 24px}
    .real-nav .nav-module-label{display:flex;align-items:center;gap:11px;margin-bottom:6px;padding:12px;color:#e7bd4e;font-size:15px;font-weight:600}
    .real-nav .nav-module-label .icon{width:20px;color:#e7bd4e;text-align:center}

    .real-nav button.nav-link:hover,.real-nav button.nav-link:focus-visible{background:rgba(255,255,255,.07);color:#fff;outline:0}
    .real-nav button.nav-link.active{border-color:rgba(201,154,46,.4);background:rgba(201,154,46,.14);color:#f0c75a;box-shadow:none;font-weight:600}
    .real-nav button.nav-link.level-two{padding-left:55px;font-size:12px}
    .real-nav button.nav-link .icon{width:18px;color:#8fa1c6;text-align:center}
    .real-nav button.nav-link.active .icon{color:#f0c75a}
    .profile{flex:0 0 auto;margin:14px;padding:12px;border:0;border-radius:9px;background:rgba(255,255,255,.08)}
    .profile .avatar{width:38px;height:38px;flex:0 0 38px;background:#1d3975;color:#fff;font-weight:600}
    .profile strong{color:#fff;font-weight:600}.profile small{font-size:11px;color:#bac7dd}
    .top{height:68px;padding:0 24px;background:#fafbfe}.global-search{display:flex;align-items:center;gap:9px;min-height:42px;padding:9px 14px}
    .global-search i{color:#667a94}.collapse,.icon-btn{display:inline-grid;place-items:center}.icon-btn i,.collapse i{font-size:16px}
    .btn i{margin-right:7px}.btn.icon-only i{margin:0}
    .notification-dot{right:5px;top:5px;width:7px;height:7px}
    /* จัดกลุ่มฟิลด์ตามโครงสร้างของแบบ คบ.1 ฉบับจริง */
    .form-group-title{grid-column:1/-1;display:flex;align-items:center;gap:9px;margin-top:10px;padding:10px 2px 7px;border-bottom:1px solid #dbe4ee;color:#174f83;font-size:14px;font-weight:700}
    .form-group-title:first-child{margin-top:0}.form-group-title i{color:#c39b32}
    .field-help{display:block;margin-top:5px;color:#6a7a90;font-size:11px;line-height:1.45}
    .official-paper-wrap{position:relative}.official-page-counter{position:sticky;top:8px;z-index:4;display:flex;justify-content:flex-end;height:0;padding-right:8px;pointer-events:none}
    .official-page-counter span{display:inline-flex;align-items:center;height:30px;padding:0 11px;border:1px solid #d7e1eb;border-radius:999px;background:rgba(255,255,255,.95);color:#28486f;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(16,40,75,.08)}
    /* ลายมือชัดเจนว่าใครเป็นผู้ลงนามและใครเป็นผู้รับรอง */
    .signature-flow{grid-column:1/-1;display:grid;gap:14px}
    .signature-order{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-left:4px solid #c6a13d;border-radius:7px;background:#fff8e8;color:#58471d;font-size:12px;line-height:1.55}
    .signature-party{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px;border:1px solid #d8e2ec;border-radius:10px;background:#fff}
    .signature-party.completed{border-color:#a9d3b9;background:#f2faf5}.signature-party.pending{background:#fbfcfe}
    .signature-party-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#eaf2fb;color:#1d5a91;font-size:20px}
    .signature-party.completed .signature-party-icon{background:#dff2e6;color:#24714a}
    .signature-party h4{margin:0 0 3px;color:#172943;font-size:15px}.signature-party p{margin:0;color:#607188;font-size:12px;line-height:1.5}
    .signature-party dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 9px;margin:9px 0 0;font-size:11px}.signature-party dt{color:#718198}.signature-party dd{margin:0;color:#253a57;font-weight:600}
    .signature-party .btn{white-space:nowrap}.signature-revision-note{display:flex;align-items:center;gap:8px;color:#6a7586;font-size:11px}
    /* แท็บหน้าผู้ยื่นใช้งานได้ทุกขั้น */
    .public-steps button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:9px 10px;border:1px solid #d5e0eb;border-radius:8px;background:#e8edf3;color:#4d6079;font:600 12px "Kanit",sans-serif;cursor:pointer}
    .public-steps button:hover,.public-steps button:focus-visible{border-color:#6d97c1;background:#f5f9fd;color:#174f83;outline:3px solid rgba(29,90,145,.12)}
    .public-steps button.active{border-color:#a8c7e5;background:#dceafa;color:#174f83}.public-steps button.complete{border-color:#add2bd;background:#edf8f1;color:#24714a}
    .public-step-content{padding-top:20px}.public-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid #e1e8ef}.public-review{display:grid;grid-template-columns:minmax(0,1fr) minmax(430px,.85fr);gap:18px}.review-summary,.public-official-preview{min-width:0}.review-summary>div:not(.field){display:grid;grid-template-columns:150px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #e5ebf1}.review-summary>div span{color:#6a7a90}.review-summary>div strong{color:#172943}
    @media(max-width:1180px){.public-review{grid-template-columns:1fr}.signature-party{grid-template-columns:48px minmax(0,1fr)}.signature-party .btn{grid-column:1/-1;justify-self:end}}
    @media(max-width:560px){.signature-party{grid-template-columns:1fr}.signature-party-icon{width:42px;height:42px}.signature-party .btn{grid-column:auto;justify-self:stretch}.public-actions{align-items:stretch;flex-direction:column}.public-actions>.actions{width:100%}.public-actions .btn{flex:1}.review-summary>div:not(.field){grid-template-columns:1fr;gap:2px}}
    @media(max-width:1440px){.workspace{grid-template-columns:minmax(0,1fr) minmax(460px,.82fr)}.paper{font-size:14px}.paper.kb1-paper .doc-row{font-size:12px}}

    /* จำลองแบบ คบ.1 ด้วย HTML บนอัตราส่วน A4 ค่าทุกค่าอยู่ใน document flow ไม่ใช้ overlay ลอย */
    .paper.kb1-paper{box-sizing:border-box;overflow:hidden;padding:5.2% 6.5% 5.8%;font-family:"TH Sarabun New","Sarabun","Thonburi",Tahoma,sans-serif;font-size:12px;line-height:1.42;box-shadow:0 3px 14px rgba(16,40,75,.16)}
    .paper.kb1-paper .secret-mark{font-size:17px;line-height:1;margin:0 0 3px}
    .paper.kb1-paper .doc-top{grid-template-columns:1fr 74px 1fr;margin:2px 0 7px}
    .paper.kb1-paper .doc-emblem img{width:49px;height:49px}
    .paper.kb1-paper .doc-meta{font-size:10.5px;line-height:1.45}
    .paper.kb1-paper .doc-title{margin:5px 0 9px;font-size:14px;line-height:1.35}
    .paper.kb1-paper .doc-section{margin:7px 0 3px;padding:0 0 2px;border-bottom:1px solid #6b7280;font-size:11.5px;line-height:1.35}

    .form-page .workspace{align-items:start}
    .form-page .form-panel,.form-page .paper-wrap{align-self:start;margin-top:0}
    .form-page .paper-wrap{position:relative;top:auto;padding:0}
    .form-page .paper.kb1-paper{border-radius:9px 9px 0 0}
    .form-page .official-page-switcher{padding:12px}
    /* รวมแถบข้อมูลแฟ้มกับแท็บหัวข้อเป็นองค์ประกอบเดียว มุมไม่ชนกัน */
    .form-page .case-context{margin:0;border-radius:10px 10px 0 0}
    .form-page .form-tabs-shell{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:stretch;margin:0;border:1px solid #dbe3eb;border-top:0;border-radius:0 0 10px 10px;background:#fbfdff;overflow:hidden}

ass="registry-a7-track" aria-label="อยู่ขั้นที่ ${nonApprovalProgress} จาก 6 ขั้น"><i style="width:${nonApprovalProgress/6*100}%"></i></span></div>`:'',activity7Action=c.activity7State==='pending'?`<button class="btn primary-action" data-activity7-result="${esc(c.no)}"><i class="fa-solid fa-inbox" aria-hidden="true"></i>บันทึกรับผล</button>`:c.activity7State==='approved'?`<button class="btn primary-action" data-activity7-next="${esc(c.no)}"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i>${esc(approvalActionLabels[approvalStep]||'เปิดงานคุ้มครอง')}</button>`:c.activity7State==='rejected'?`<button class="btn primary-action" data-go="case-nonapproval" data-case-no="${esc(c.no)}"><i class="fa-solid ${nonApprovalStepIcons[nonApprovalStep]||'fa-scale-balanced'}" aria-hidden="true"></i>${esc(nonApprovalActionLabels[nonApprovalStep]||'เปิดงานอุทธรณ์')}</button>`:'',protectionFlags=c.stage==='protection'?[c.actualStartedAt?'started':'waiting',c.importantEvents?.length?'important':'',(c.extensionRequests?.length||c.sla)?'extension':''].filter(Boolean).join(' '):'',flaggedForReturn=showReturnNote&&c.returned&&c.returnedBy,statusBadge=flaggedForReturn?`<button type="button" class="badge danger return-flag" data-return-detail="${esc(c.no)}" title="ดูรายละเอียดที่ต้องแก้ไข"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i>${esc(c.status)}</button>`:c.activity7State==='rejected'?`<span class="registry-decision-badge"><i class="fa-solid fa-circle-xmark" aria-hidden="true"></i>เลขาธิการ ป.ป.ท. ไม่อนุมัติ</span><small class="registry-decision-next">รอเจ้าหน้าที่จัดทำ คบ.10</small>`:badge(c);return `<tr class="${rowClass}" data-case-status="${esc(c.status)}" data-case-urgent="${urgent?'true':'false'}" data-case-decision="${esc(c.activity7State||'')}" data-case-protection-flags="${esc(protectionFlags)}"><td><button class="case-link" data-track="${c.no}" title="ดูสถานะและเส้นทางคำร้อง">${c.no}</button><small>04/08/2026 10:30</small></td><td><span class="badge">${c.form}</span><small>${caseType}</small>${withdrawalTag}</td><td><strong>${c.person}</strong>${c.source?`<span class="source-badge"><i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i>${c.source}</span>`:'<small>เจ้าหน้าที่บันทึกรับเรื่อง</small>'}</td><td>${statusBadge}<small>ระดับความเสี่ยง ${c.risk}</small>${activity7Meta}</td><td><strong>${c.owner}</strong><small>${c.next}</small>${approvalMeta}${nonApprovalMeta}</td><td><div class="registry-row-actions"><button class="btn secondary" data-go="${targetRoute}" data-case-no="${c.no}"><i class="fa-solid fa-folder-open" aria-hidden="true"></i>เปิดแฟ้ม</button>${activity7Action}</div></td></tr>`}).join('')}

const formPageBeforeKb3=formPage;

 if(number!==3)return formPageBeforeKb3(number);
 const form=forms.find(item=>item.n===3),originalSections=form.sections,visibleSections=kb3Sections(form),originalSigned=signed;
 if(formSection>=visibleSections.length)formSection=0;
 form.sections=visibleSections;signed=kb3IsSigned();

 const banner=kb3Mode==='withdrawal'?`<section class="kb3-mode-banner withdrawal"><div><strong><i class="fa-solid fa-file-circle-minus"></i> บันทึกคำขอถอนก่อนมีคำสั่งหลัก</strong><small>ใช้ คบ.3 บันทึกความประสงค์ เหตุผล และหลักฐานยืนยัน จากนั้นเสนอพิจารณาตามลำดับชั้น เรื่องจะสิ้นสุดเมื่อมีคำสั่ง แจ้งผล และบันทึกหลักฐานการรับครบถ้วน</small></div><button class="btn danger-outline" data-action="cancel-withdrawal">กลับไปบันทึกข้อเท็จจริงทั่วไป</button></section>`:'';
 return banner?html.replace('<div class="form-tabs-shell">',banner+'<div class="form-tabs-shell">'):html;
};

function currentCaseItem(){return demoCases.find(item=>item.no===(activeCaseNo||'WP-2569-000456'))||demoCases.find(item=>item.no==='WP-2569-000456')}
function showReturnDetailPopup(item){Swal.fire({icon:'warning',title:'แฟ้มนี้ถูกส่งกลับแก้ไข',html:`<div style="text-align:left"><p style="margin:0 0 10px"><b>ส่งกลับโดย:</b> ${esc(item.returnedBy||'-')}</p><p style="margin:0 0 10px"><b>ประเด็นที่ต้องแก้ไข:</b> ${esc(item.returnIssueLabel||'-')}</p><p style="margin:0 0 10px"><b>รายละเอียด:</b><br>${esc(item.returnNote||'-')}</p>${item.returnDue?`<p style="margin:0"><b>กำหนดส่งกลับ:</b> ${esc(item.returnDue)}</p>`:''}</div>`,confirmButtonText:'รับทราบ',confirmButtonColor:'#1d5a91',customClass:{popup:'ecmis-swal'}})}
let lastReturnPopupCaseNo=null;
function autoShowReturnDetail(){
 const route=location.hash.replace(/^#\//,'')||'registry';
 if(route!=='case'&&route!=='case-urgent-kb2'){lastReturnPopupCaseNo=null;return}
 if(currentRole!=='officer'&&currentRole!=='supervisor')return;
 const item=currentCaseItem();
 if(!item||!item.returned||!item.returnedBy||item.no===lastReturnPopupCaseNo)return;
 lastReturnPopupCaseNo=item.no;
 showReturnDetailPopup(item);
}
let lastProtectionStartPopupCaseNo=null;

 const item=currentCaseItem();
 if(!item||item.stage!=='protection'||item.teamAcknowledged||item.no===lastProtectionStartPopupCaseNo)return;

 protectionStartDialog(item);
}

function withdrawalStageActionHtml(item){

 else if(item.stage==='notice'&&item.withdrawalReceiptRecorded)primary=currentRole==='admin'?'<button class="btn" data-withdrawal-next="close"><i class="fa-solid fa-box-archive"></i>ปิดกระบวนการถอนคำร้อง</button>':'<span class="muted"><i class="fa-solid fa-circle-check"></i> บันทึกหลักฐานการรับแล้ว รอผู้มีสิทธิ์ปิดกระบวนการ</span>';

  return base(title,desc,'')+`<section class="stats">${stats.map((x,i)=>`<button type="button" class="stat stat-clickable ${i===1?'warning':i===2?'danger':i===4?'success':''}" data-stat-filter="${x[3]}"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></button>`).join('')}</section>${tabNav}<section class="toolbar"><div class="field"><label>ค้นหาเลขคำร้องหรือชื่อ</label><input data-table-search placeholder="เลขคำร้อง ชื่อ หรือเลขคดีหลัก"></div><div class="field"><label>สถานะ</label><select data-status-filter><option value="__all">ทุกสถานะ</option><option value="__normal">กรณีปกติ (คบ.1)</option><option value="__urgent">กรณีจำเป็นเร่งด่วน (คบ.2)</option>${statusOptions.map(status=>`<option value="${esc(status)}">${esc(status)}</option>`).join('')}</select></div><button class="btn" data-action="search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>ค้นหา</button><button class="btn secondary" data-action="reset"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i>ล้างเงื่อนไข</button></section>${advancedFilters()}${tableCard(title,items)}`;
 }
 const items=directorMonitoringItems(directorTab);
 return base('งานผู้อำนวยการสำนัก/กอง','พิจารณาความเห็น ลงนาม และติดตามงานหลังเริ่มคุ้มครอง','')+tabNav+
 `${items.length?tableCard(directorTabDefs[directorTab],items,true):`<section class="card"><div class="card-head"><div><h2>${directorTabDefs[directorTab]}</h2><p>ยังไม่มีรายการในขั้นนี้ในชุดข้อมูลตัวอย่างปัจจุบัน</p></div></div></section>`}`;
};
casePage=function(){const item=currentCaseItem();if(item?.activity7State==='rejected')return rejectedCaseFolderPage(item);if(item?.activity7State==='approved'&&(item.approvalStep||0)<9)return approvedCaseFolderPage(item);if(item?.stage==='protection')return protectionCaseFolderPage(item);if(isUrgentCase(item))return urgentKb2CasePage();return normalCaseFolderPage()};
const renderBeforeUnifiedActivity7=render;
render=function(){
 const requestedRoute=location.hash.replace(/^#\//,'')||'registry';
 if(requestedRoute==='queue-external')history.replaceState(null,'',`${location.pathname}${location.search}#/registry`);
 renderBeforeUnifiedActivity7();
 const renderedRoute=location.hash.replace(/^#\//,'')||'registry';
 if(renderedRoute==='registry')bindIntakeRegistry();
 if(renderedRoute==='queue-officer')bindActivity7Registry();
 if(renderedRoute==='protection'||renderedRoute==='case')bindProtectionOperations();
};
document.getElementById('role').onchange=e=>{currentRole=e.target.value;const target=roleRoutes[currentRole]||'registry';toast('เปลี่ยนบทบาทเป็น '+roleNames[currentRole]);if((location.hash.replace(/^#\//,'')||'registry')===target)render();else go(target)};window.addEventListener('hashchange',()=>{formSection=0;manualKb1Page=null;manualKb3Page=null;manualKb6Page=null;render()});render();
</script>
</body>
