name: "Release: tag, build, and publish"

on:
    push:
        # branches: ["mercil-deployment"]
        branches: [""]
    workflow_dispatch: # "cut a release now" — runs the same tag -> build chain

permissions: {} # no workflow-level default — every job declares exactly what it needs

concurrency:
    group: release-mercil-deployment
    cancel-in-progress: false # two quick merges queue instead of racing to tag the same version

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    tag:
        name: Compute next version and tag
        runs-on: ubuntu-latest
        permissions:
            contents: write # create and push the tag
        outputs:
            new_tag: ${{ steps.version.outputs.new_tag }} # e.g. v1.2.3 — the git ref
            new_version: ${{ steps.version.outputs.new_version }} # e.g. 1.2.3 — the image tag value
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # full history required to find the last tag and walk commits since

            - name: Compute next version from commit messages
              id: version
              uses: mathieudutour/github-tag-action@v6.2
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  default_bump: patch # used when no fix:/feat:/BREAKING CHANGE commits qualify
                  tag_prefix: "v"
                  create_annotated_tag: true

    build-and-push:
        name: Build and push image
        needs: [tag]
        if: needs.tag.outputs.new_tag != ''
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.tag.outputs.new_tag }} # build what got tagged, not whatever HEAD drifted to

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  # Exactly two tags: the immutable version, and latest. Nothing else.
                  # `type=semver` would parse github.ref_name, which is the *branch* on this trigger —
                  # take the version from the tag job's output instead. Don't "fix" this back to semver.
                  tags: |
                      type=raw,value=${{ needs.tag.outputs.new_version }}
                      type=raw,value=latest
                  labels: |
                      org.opencontainers.image.title=A6-E-CMISWitness-Protection
                      org.opencontainers.image.description=E-CMIS ระบบคุ้มครองพยาน กิจกรรมที่ 6

            - name: Build and push
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: "linux/amd64,linux/arm64"
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  provenance: false

            - name: Job summary
              env:
                  IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
              run: |
                  # Registry paths are lowercase; repo names may contain uppercase.
                  IMAGE_REF="$(echo "$IMAGE_REF" | tr '[:upper:]' '[:lower:]')"
                  {
                    echo "### Image published"
                    echo
                    echo "**Tag:** \`${{ needs.tag.outputs.new_tag }}\`"
                    echo "**Version:** \`${{ needs.tag.outputs.new_version }}\`"
                    echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
                    echo "**Platforms:** linux/amd64,linux/arm64"
                    echo
                    echo "**Tags:**"
                    echo '```'
                    echo "${{ steps.meta.outputs.tags }}"
                    echo '```'
                    echo
                    echo "**Run:**"
                    echo '```sh'
                    echo "docker run -p 8080:80 ${IMAGE_REF}:${{ needs.tag.outputs.new_version }}"
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
